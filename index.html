<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/atclean-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATClean — Professional Cleaning Services</title>
    <meta
      name="description"
      content="Professional cleaning services for homes and offices. Book online or chat with us on WhatsApp for a calmer, cleaner space."
    />

    <!-- Open Graph — controls the preview card shown when this link is
         pasted into WhatsApp, Facebook, iMessage, Slack, etc. og:image
         must be a raster image (PNG/JPG) — social crawlers don't render
         SVGs, which is why this points at a dedicated PNG rather than
         the site's own SVG logo. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ATClean — Professional Cleaning Services" />
    <meta
      property="og:description"
      content="Professional cleaning services for homes and offices. Book online or chat with us on WhatsApp for a calmer, cleaner space."
    />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter's card format overlaps with Open Graph but isn't
         identical — some platforms (Twitter/X, some link-preview bots)
         look for these specifically rather than falling back to og:*. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATClean — Professional Cleaning Services" />
    <meta
      name="twitter:description"
      content="Professional cleaning services for homes and offices. Book online or chat with us on WhatsApp for a calmer, cleaner space."
    />
    <meta name="twitter:image" content="/og-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
